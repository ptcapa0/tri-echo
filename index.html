<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08131a"><meta name="description" content="TRI//ECHO — a mesa lembra-se das tuas carambolas."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="apple-touch-icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css"><title>TRI//ECHO</title></head>
<body><main id="app">
 <header><button id="homeBtn" class="brand" aria-label="Menu principal">TRI<span>//</span>ECHO</button><div class="hud"><div><small>PONTOS</small><b id="score">0</b></div><div><small>SÉRIE</small><b id="streak">0</b></div><div id="statusBox"><small id="statusLabel">VIDAS</small><b id="status">●●●</b></div></div><button id="settingsBtn" class="icon" aria-label="Definições">⚙</button></header>
 <section id="stage" aria-label="Mesa de jogo"><canvas id="game"></canvas><div id="toast" role="status" aria-live="polite"></div><div id="tutorial" class="coach hidden"><b id="coachTitle"></b><span id="coachText"></span></div></section>
 <footer><span id="objective">Toca nas duas bolas</span><button id="retryBtn">Nova mesa</button></footer>
</main>
<dialog id="menu"><div class="panel"><p class="eyebrow">A MESA LEMBRA-SE</p><h1>TRI<span>//</span>ECHO</h1><p>Cria carambolas. As melhores trajetórias tornam-se rails físicos na jogada seguinte.</p><label>Modo<select id="mode"><option value="flow">Flow</option><option value="zen">Zen</option><option value="precision">Precision</option><option value="rush">Rush</option><option value="daily">Daily Seed</option></select></label><label>Dificuldade<select id="difficulty"><option value="relaxed">Relaxado</option><option value="normal">Normal</option><option value="hard">Difícil</option><option value="adaptive">Adaptativo</option></select></label><button id="playBtn" class="primary">JOGAR</button><button id="progressBtn">Progresso e conquistas</button><button id="openSettings">Definições</button></div></dialog>
<dialog id="settings"><div class="panel"><h2>Definições</h2><label class="toggle"><input id="sound" type="checkbox"> Som</label><label class="toggle"><input id="haptics" type="checkbox"> Vibração</label><label class="toggle"><input id="reduced" type="checkbox"> Reduzir movimento</label><button id="tutorialBtn">Repetir tutorial</button><div class="row"><button id="exportBtn">Exportar</button><label class="fileBtn">Importar<input id="importFile" type="file" accept="application/json"></label></div><button class="close">Fechar</button></div></dialog>
<dialog id="progress"><div class="panel"><h2>Progresso local</h2><div id="stats"></div><button class="close">Fechar</button></div></dialog>
<script type="module" src="js/app.js"></script></body></html>
