<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08131a"><meta name="description" content="TRI//ECHO — bilhar, golf e física futurista numa mesa que se lembra."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="style.css"><title>TRI//ECHO</title></head>
<body><main id="app">
 <header><button id="homeBtn" class="brand" aria-label="Menu principal">TRI<span>//</span>ECHO</button><div class="hud"><div><small id="scoreLabel">RESULTADO</small><b id="score">E</b></div><div><small id="streakLabel">TACADAS</small><b id="streak">0</b></div><div><small id="statusLabel">PAR</small><b id="status">3</b></div></div><button id="settingsBtn" class="icon" aria-label="Definições">⚙</button></header>
 <section id="stage" aria-label="Mesa de jogo"><canvas id="game"></canvas>
  <div id="contactControl" class="contact-control hidden" aria-label="Controlo móvel do ponto de impacto"><button id="moveContact" class="move-contact" aria-label="Mover controlo de impacto">⠿ MOVER</button><div id="cueFace" class="cue-face" role="slider" aria-label="Ponto onde o taco atinge a bola branca"><i id="contactDot"></i></div><small id="spinLabel">CENTRO</small></div>
  <div id="powers" class="powers hidden" aria-label="Poderes disponíveis"></div><div id="toast" role="status" aria-live="polite"></div><div id="tutorial" class="coach hidden"><b id="coachTitle"></b><span id="coachText"></span></div>
 </section>
 <footer><span id="objective">Emboca em poucas tacadas</span><button id="retryBtn">Recomeçar</button></footer>
</main>
<dialog id="menu"><div class="panel"><p class="eyebrow">BILHAR REIMAGINADO</p><h1>TRI<span>//</span>ECHO <sup>3</sup></h1><p>Joga ao par no Portal Golf, regressa à carambola clássica ou mistura as duas regras no modo Fusion.</p><label>Modo<select id="mode"><option value="golf">Portal Golf</option><option value="classic">Carambola Clássica</option><option value="hybrid">Fusion</option><option value="tour">Echo Tour</option><option value="daily">Daily Golf</option></select></label><p id="modeDescription" class="mode-description"></p><label>Dificuldade<select id="difficulty"><option value="relaxed">Relaxado</option><option value="normal">Normal</option><option value="hard">Difícil</option><option value="adaptive">Adaptativo</option></select></label><button id="playBtn" class="primary">JOGAR</button><button id="progressBtn">Cartão e conquistas</button><button id="openSettings">Definições</button></div></dialog>
<dialog id="settings"><div class="panel"><h2>Definições</h2><label class="toggle"><input id="sound" type="checkbox"> Som</label><label class="toggle"><input id="haptics" type="checkbox"> Vibração</label><label class="toggle"><input id="reduced" type="checkbox"> Reduzir movimento</label><button id="tutorialBtn">Repetir tutorial</button><div class="row"><button id="exportBtn">Exportar</button><label class="fileBtn">Importar<input id="importFile" type="file" accept="application/json"></label></div><button class="close">Fechar</button></div></dialog>
<dialog id="progress"><div class="panel"><h2>Progresso local</h2><div id="stats"></div><button class="close">Fechar</button></div></dialog>
<script type="module" src="js/app.js"></script></body></html>
